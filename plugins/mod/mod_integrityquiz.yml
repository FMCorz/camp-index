summary: Integrity Quiz (modintegrityquiz) is a Moodle activity module for monitored
  online assessments. It combines structured MCQ/True-False authoring with optional
  camera snapshots, tab-switch monitoring, server-side suspension, per-question timing,
  Moodle gradebook integration, and teacher review tools.
